<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Verdana, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="ceuAntes" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b5a7a"/><stop offset="1" stop-color="#9c8aa8"/>
    </linearGradient>
    <linearGradient id="ceuDepois" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fa8c7"/><stop offset="1" stop-color="#bfe0ea"/>
    </linearGradient>
    <linearGradient id="madeira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98a52"/><stop offset="1" stop-color="#8a6236"/>
    </linearGradient>
    <linearGradient id="painel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b67e"/><stop offset="1" stop-color="#cf9f63"/>
    </linearGradient>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#ffd76a" flood-opacity=".95"/>
    </filter>
  </defs>

  <style>
    .t   { font-weight: bold; }
    .ct  { stroke:#3a2a1c; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    .ctf { stroke:#3a2a1c; stroke-width:4; fill:none; stroke-linecap:round; }
  </style>

  <!-- ================= FUNDOS ================= -->
  <rect x="0" y="0" width="640" height="720" fill="url(#ceuAntes)"/>
  <rect x="640" y="0" width="640" height="720" fill="url(#ceuDepois)"/>
  <rect x="0" y="560" width="640" height="160" fill="#6a6152"/>
  <rect x="640" y="560" width="640" height="160" fill="#7e9464"/>

  <!-- ================= TITULO ================= -->
  <rect x="0" y="0" width="1280" height="104" fill="#2f2114" opacity=".9"/>
  <text x="640" y="56" class="t" font-size="50" fill="#ffd98a" text-anchor="middle"
        letter-spacing="3">OUT OF STOCK</text>
  <text x="640" y="87" font-size="21" fill="#e8d6b8" text-anchor="middle">
    o que sua loja zerou, na propria mesa que fabrica  ·  what your shop ran out of, on the table that makes it</text>

  <!-- ================= ETIQUETAS ================= -->
  <g filter="url(#sombra)">
    <rect x="34" y="126" width="238" height="52" rx="10" fill="#7d2f2f" class="ct"/>
    <text x="153" y="154" class="t" font-size="24" fill="#ffdede" text-anchor="middle">ANTES</text>
    <text x="153" y="172" font-size="14" fill="#efb9b9" text-anchor="middle" letter-spacing="1.5">BEFORE</text>
  </g>
  <g filter="url(#sombra)">
    <rect x="1008" y="126" width="238" height="52" rx="10" fill="#2f6b43" class="ct"/>
    <text x="1127" y="154" class="t" font-size="24" fill="#dcf3e4" text-anchor="middle">AGORA</text>
    <text x="1127" y="172" font-size="14" fill="#b4d8c2" text-anchor="middle" letter-spacing="1.5">NOW</text>
  </g>

  <!-- ===================================================================
       LADO ESQUERDO : o vai e vem
       =================================================================== -->

  <!-- LOJA -->
  <g filter="url(#sombra)">
    <rect x="52" y="250" width="200" height="200" rx="8" fill="url(#madeira)" class="ct"/>
    <rect x="72" y="292" width="160" height="96" rx="5" fill="#f0e2c8" class="ct"/>
    <!-- prateleiras vazias -->
    <line x1="80" y1="326" x2="224" y2="326" stroke="#b9a684" stroke-width="7"/>
    <line x1="80" y1="360" x2="224" y2="360" stroke="#b9a684" stroke-width="7"/>
    <!-- toldo -->
    <path d="M42 250 h220 l-16 -34 h-188 z" fill="#c0563f" class="ct"/>
    <text x="152" y="277" class="t" font-size="16" fill="#4a3823" text-anchor="middle">LOJA · SHOP</text>
    <!-- placa SOLD OUT -->
    <g transform="rotate(-9 152 344)">
      <rect x="82" y="326" width="140" height="38" rx="5" fill="#d23b3b" class="ct"/>
      <text x="152" y="345" class="t" font-size="17" fill="#fff" text-anchor="middle">ZERADO!</text>
      <text x="152" y="360" font-size="12" fill="#ffd9d9" text-anchor="middle">SOLD OUT!</text>
    </g>
  </g>
  <!-- sino tocando -->
  <g filter="url(#sombra)" transform="translate(236 232)">
    <path d="M0 26 a20 20 0 0 1 40 0 v16 h6 v8 H-6 v-8 h6 z" fill="#ffd76a" class="ct"/>
    <circle cx="20" cy="56" r="6" fill="#ffd76a" class="ct"/>
    <path d="M-14 8 q-8 -10 -4 -20 M54 8 q8 -10 4 -20" class="ctf"/>
  </g>

  <!-- MESA -->
  <g filter="url(#sombra)">
    <rect x="396" y="330" width="196" height="120" rx="6" fill="url(#madeira)" class="ct"/>
    <rect x="384" y="312" width="220" height="28" rx="5" fill="#c99a5e" class="ct"/>
    <rect x="412" y="450" width="22" height="70" fill="#8a6236" class="ct"/>
    <rect x="554" y="450" width="22" height="70" fill="#8a6236" class="ct"/>
    <!-- serra e tabua -->
    <path d="M430 300 l70 -22 l8 16 l-70 22 z" fill="#cfd3d6" class="ct"/>
    <rect x="440" y="352" width="110" height="18" rx="3" fill="#e0c294" class="ct"/>
    <text x="494" y="404" class="t" font-size="15" fill="#3a2a1c" text-anchor="middle">MESA · TABLE</text>
  </g>

  <!-- setas de vai e vem, numeradas -->
  <g opacity=".95">
    <path d="M262 300 C320 250, 360 250, 400 300" class="ctf" stroke="#ffe9a8" stroke-width="7"/>
    <path d="M392 288 l16 14 l-19 9" fill="none" stroke="#ffe9a8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M400 470 C350 520, 310 520, 266 470" class="ctf" stroke="#ffc9c9" stroke-width="7"/>
    <path d="M276 480 l-14 -14 l20 -8" fill="none" stroke="#ffc9c9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="t" font-size="24" fill="#fff5d6">
    <circle cx="330" cy="246" r="19" fill="#7d2f2f" class="ct"/><text x="330" y="254" text-anchor="middle">1</text>
    <circle cx="332" cy="520" r="19" fill="#7d2f2f" class="ct"/><text x="332" y="528" text-anchor="middle">2</text>
    <circle cx="312" cy="300" r="19" fill="#7d2f2f" class="ct"/><text x="312" y="308" text-anchor="middle">3</text>
    <circle cx="318" cy="470" r="16" fill="#7d2f2f" class="ct" opacity=".55"/><text x="318" y="477" text-anchor="middle" font-size="19" opacity=".8">4</text>
  </g>

  <!-- bonequinho correndo, suando -->
  <g filter="url(#sombra)" transform="translate(318 396)">
    <circle cx="0" cy="-30" r="24" fill="#f2c9a0" class="ct"/>
    <path d="M-22 -44 q22 -20 44 0 q-8 -16 -22 -16 q-14 0 -22 16 z" fill="#4a3424" class="ct"/>
    <circle cx="-8" cy="-32" r="3.4" fill="#2a1c12"/><circle cx="9" cy="-32" r="3.4" fill="#2a1c12"/>
    <path d="M-9 -20 q9 9 18 0" class="ctf" stroke-width="3.4"/>
    <rect x="-19" y="-6" width="38" height="44" rx="9" fill="#3f7a4e" class="ct"/>
    <path d="M-19 8 q-26 -6 -32 -26" class="ctf"/>
    <path d="M19 8 q26 10 34 -6" class="ctf"/>
    <path d="M-10 38 l-16 34 M10 38 l18 32" class="ctf"/>
    <!-- suor -->
    <g fill="#8fd0ef" stroke="#3a2a1c" stroke-width="2.6">
      <path d="M28 -50 q7 10 0 15 q-7 -5 0 -15z"/>
      <path d="M-32 -44 q6 9 0 13 q-6 -4 0 -13z"/>
    </g>
    <!-- linhas de movimento -->
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".75">
      <line x1="-54" y1="6" x2="-80" y2="6"/><line x1="-50" y1="22" x2="-72" y2="22"/>
    </g>
  </g>

  <!-- relogio -->
  <g filter="url(#sombra)" transform="translate(556 226)">
    <circle cx="0" cy="0" r="34" fill="#f4ead6" class="ct"/>
    <path d="M0 0 v-20 M0 0 l15 9" class="ctf" stroke-width="5"/>
    <circle cx="0" cy="0" r="4" fill="#3a2a1c"/>
  </g>
  <text x="320" y="612" class="t" font-size="25" fill="#ffe2e2" text-anchor="middle">ir a loja, voltar a mesa, de novo, de novo...</text>
  <text x="320" y="644" font-size="20" fill="#e6d3d3" text-anchor="middle">walk to the shop, back to the table, again, again...</text>

  <!-- ================= DIVISOR ================= -->
  <g>
    <line x1="640" y1="104" x2="640" y2="720" stroke="#2f2114" stroke-width="7" opacity=".55"/>
    <g filter="url(#sombra)" transform="translate(640 372)">
      <circle cx="0" cy="0" r="46" fill="#ffd76a" class="ct"/>
      <path d="M-16 0 h26 M6 -14 l16 14 l-16 14" fill="none" stroke="#3a2a1c" stroke-width="7"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ===================================================================
       LADO DIREITO : uma aba
       =================================================================== -->

  <!-- janela da mesa -->
  <g filter="url(#sombra)">
    <rect x="700" y="206" width="510" height="330" rx="12" fill="#6b4b2a" class="ct"/>
    <rect x="712" y="218" width="486" height="306" rx="8" fill="url(#painel)"/>

    <!-- abas -->
    <g class="t" font-size="15" fill="#5a4326">
      <rect x="722" y="226" width="96" height="34" rx="6" fill="#c08f57" class="ct" stroke-width="3"/>
      <text x="770" y="249" text-anchor="middle">Craft</text>
      <rect x="824" y="226" width="86" height="34" rx="6" fill="#c08f57" class="ct" stroke-width="3"/>
      <text x="867" y="249" text-anchor="middle">Modules</text>
      <g filter="url(#brilho)">
        <rect x="916" y="222" width="150" height="40" rx="6" fill="#ffd76a" class="ct" stroke-width="3"/>
        <text x="991" y="248" text-anchor="middle" font-size="16" fill="#3a2a1c">Out of Stock</text>
      </g>
      <rect x="1072" y="226" width="114" height="34" rx="6" fill="#c08f57" class="ct" stroke-width="3"/>
      <text x="1129" y="249" text-anchor="middle">For Sale</text>
    </g>

    <!-- conteudo -->
    <rect x="722" y="272" width="466" height="36" rx="5" fill="#d9ab6d" class="ct" stroke-width="3"/>
    <text x="736" y="296" font-size="17" fill="#4a3823">Store:</text>
    <text x="960" y="296" class="t" font-size="17" fill="#2f6b43" text-anchor="middle">RM STORE   (1 / 1)</text>

    <g class="t" font-size="16" fill="#3a2a1c">
      <rect x="866" y="318" width="180" height="38" rx="6" fill="#e8c48a" class="ct" stroke-width="3"/>
      <text x="956" y="343" text-anchor="middle">REFRESH</text>
    </g>

    <text x="736" y="392" class="t" font-size="18" fill="#4a3823">Missing here:</text>
    <g font-size="19" fill="#1f4fa8" class="t">
      <rect x="736" y="406" width="22" height="22" rx="4" fill="#d8bf95" class="ct" stroke-width="3"/>
      <text x="768" y="424">Board</text>
      <rect x="736" y="440" width="22" height="22" rx="4" fill="#d8bf95" class="ct" stroke-width="3"/>
      <text x="768" y="458">Hardwood Board</text>
      <rect x="736" y="474" width="22" height="22" rx="4" fill="#d8bf95" class="ct" stroke-width="3"/>
      <text x="768" y="492">Softwood Board</text>
    </g>
  </g>

  <!-- bonequinho relaxado, apontando -->
  <g filter="url(#sombra)" transform="translate(1108 470)">
    <circle cx="0" cy="-30" r="24" fill="#f2c9a0" class="ct"/>
    <path d="M-22 -44 q22 -20 44 0 q-8 -16 -22 -16 q-14 0 -22 16 z" fill="#4a3424" class="ct"/>
    <circle cx="-8" cy="-33" r="3.4" fill="#2a1c12"/><circle cx="9" cy="-33" r="3.4" fill="#2a1c12"/>
    <path d="M-10 -22 q10 12 20 0" class="ctf" stroke-width="3.4"/>
    <rect x="-19" y="-6" width="38" height="44" rx="9" fill="#3f7a4e" class="ct"/>
    <path d="M-19 6 q-22 12 -20 28" class="ctf"/>
    <path d="M19 4 q24 -22 -6 -46" class="ctf"/>
    <path d="M-10 38 l-6 34 M10 38 l8 34" class="ctf"/>
  </g>
  <!-- clique -->
  <g transform="translate(1048 198)">
    <circle cx="0" cy="0" r="17" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>
    <circle cx="0" cy="0" r="29" fill="none" stroke="#fff" stroke-width="4" opacity=".45"/>
  </g>

  <text x="960" y="612" class="t" font-size="27" fill="#20402c" text-anchor="middle">so trocar de aba.</text>
  <text x="960" y="644" font-size="20" fill="#2b4d38" text-anchor="middle">just switch tabs.</text>

  <!-- rodape -->
  <rect x="0" y="676" width="1280" height="44" fill="#2f2114" opacity=".9"/>
  <text x="26" y="700" font-size="15" fill="#e8d6b8">Eco 0.14.1  ·  69 mesas de fabricacao  ·  sem override, sem Harmony</text>
  <text x="26" y="714" font-size="13" fill="#b9a98c">Eco 0.14.1  ·  all 69 crafting tables  ·  no override, no Harmony</text>
  <text x="1254" y="705" font-size="17" fill="#ffd98a" text-anchor="end" class="t">BBC-Brasil</text>
</svg>
